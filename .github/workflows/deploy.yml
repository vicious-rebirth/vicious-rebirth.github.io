name: Deploy

on:
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: .

  vicious:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone https://github.com/vicious-rebirth/vicious.git

      - name: Build
        working-directory: vicious
        run: docker build -t build -f packages/docker/build/web/Dockerfile .

      - name: Extract
        run: |
          docker create --name tmp build
          docker cp tmp:/out ./dist
          docker rm tmp

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vicious
          path: vicious/dist

  package:
    runs-on: ubuntu-latest
    needs: [vicious, website]
    steps:
      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: website
          path: package

      - name: Download vicious
        uses: actions/download-artifact@v4
        with:
          name: vicious
          path: vicious

      - name: Package
        run: |
          mv vicious/* package/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: package

  deploy:
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
